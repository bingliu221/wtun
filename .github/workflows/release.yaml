name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  BIN_NAME: wtun
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            targets: "x86_64-unknown-linux-gnu:gnu x86_64-unknown-linux-musl:musl"
            rust_targets: "x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl"
          - runner: ubuntu-22.04-arm
            arch: arm64
            targets: "aarch64-unknown-linux-gnu:gnu aarch64-unknown-linux-musl:musl"
            rust_targets: "aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p dist artifacts

          for item in ${{ matrix.targets }}; do
            target="${item%%:*}"
            libc="${item#*:}"

            cargo build --release --target "$target"

            bin="target/$target/release/${BIN_NAME}"
            cp "$bin" "dist/${BIN_NAME}"
            cp "$bin" "artifacts/${BIN_NAME}-${libc}"
            tar -czf "${BIN_NAME}-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}-${libc}.tar.gz" -C dist "${BIN_NAME}"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: artifacts/
          retention-days: 1

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"

  docker:
    name: Docker (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.arch }}

      - name: Prepare Docker context
        run: |
          chmod +x ${BIN_NAME}-musl ${BIN_NAME}-gnu

          cat > Dockerfile.alpine <<'EOF'
          FROM alpine
          RUN apk add --no-cache ca-certificates
          COPY wtun-musl /usr/local/bin/wtun
          ENTRYPOINT ["wtun"]
          EOF

          cat > Dockerfile.glibc <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY wtun-gnu /usr/local/bin/wtun
          ENTRYPOINT ["wtun"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.alpine
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-alpine-${{ matrix.arch }}

      - name: Build and push Glibc image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.glibc
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-glibc-${{ matrix.arch }}

  merge-docker:
    name: Merge Docker Manifests
    needs: docker
    runs-on: ubuntu-22.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Alpine manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.ref_name }}-alpine \
            --tag ${{ env.IMAGE }}:latest-alpine \
            ${{ env.IMAGE }}:${{ github.ref_name }}-alpine-amd64 \
            ${{ env.IMAGE }}:${{ github.ref_name }}-alpine-arm64

      - name: Merge Glibc manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.ref_name }} \
            --tag ${{ env.IMAGE }}:${{ github.ref_name }}-glibc \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.ref_name }}-glibc-amd64 \
            ${{ env.IMAGE }}:${{ github.ref_name }}-glibc-arm64
