name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  BIN_NAME: wtun
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache rust
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p release artifacts

          TARGETS=(
            "x86_64-unknown-linux-gnu:amd64:gnu"
            "x86_64-unknown-linux-musl:amd64:musl"
            "aarch64-unknown-linux-gnu:arm64:gnu"
            "aarch64-unknown-linux-musl:arm64:musl"
            "armv7-unknown-linux-gnueabihf:armv7:gnu"
            "armv7-unknown-linux-musleabihf:armv7:musl"
            "riscv64gc-unknown-linux-gnu:riscv64:gnu"
            "riscv64gc-unknown-linux-musl:riscv64:musl"
          )

          for item in "${TARGETS[@]}"; do
            IFS=':' read -r target arch libc <<< "$item"
            echo "::group::Building $target ($arch, $libc)"

            cross build --release --target "$target"

            bin="target/$target/release/${BIN_NAME}"
            cp "$bin" "artifacts/${BIN_NAME}-${arch}-${libc}"
            cp "$bin" "release/${BIN_NAME}-${VERSION}-linux-${arch}-${libc}"

            echo "::endgroup::"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: artifacts/
          retention-days: 1

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.VERSION }}
          files: release/*

  docker:
    name: Docker
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: artifacts

      - name: Prepare Docker context
        run: |
          chmod +x artifacts/*

          cat > Dockerfile.alpine <<'EOF'
          FROM alpine
          ARG TARGETARCH
          ARG TARGETVARIANT
          RUN apk add --no-cache ca-certificates
          COPY artifacts/wtun-${TARGETARCH}${TARGETVARIANT}-musl /usr/local/bin/wtun
          ENTRYPOINT ["wtun"]
          EOF

          cat > Dockerfile.glibc <<'EOF'
          FROM debian:trixie-slim
          ARG TARGETARCH
          ARG TARGETVARIANT
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY artifacts/wtun-${TARGETARCH}${TARGETVARIANT}-gnu /usr/local/bin/wtun
          ENTRYPOINT ["wtun"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Alpine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.alpine
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}-alpine
            ${{ env.IMAGE }}:latest-alpine

      - name: Build and push Glibc image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.glibc
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.VERSION }}-glibc
            ${{ env.IMAGE }}:latest
